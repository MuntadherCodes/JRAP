server:
  port: 8090   # distinctive port for busy dev machines (override: SERVER_PORT)

spring:
  application:
    name: jrap
  datasource:
    # The application connects as the restricted role subject to row-level security.
    url: jdbc:postgresql://localhost:5442/jrap   # docker-compose publishes 5442 (see compose file)
    username: jrap_app
    password: jrap_app
  flyway:
    # Migrations run as the schema owner (docker-compose superuser in dev; a dedicated
    # migration role in production).
    user: jrap
    password: jrap
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    version: openapi_3_1   # §3.2.2: the public API is documented as OpenAPI 3.1

jrap:
  # Contact address declared in the crawler/API User-Agent (CON-2/CON-3) — set per deployment.
  contact-email: contact@jrap.example
  app:
    # Frontend base URL used in verification/invitation links.
    base-url: http://localhost:5173
  integrations:
    openalex-base-url: https://api.openalex.org
    crossref-base-url: https://api.crossref.org
    doaj-base-url: https://doaj.org
    issn-portal-base-url: https://portal.issn.org
    cache-ttl: P7D          # FR-INT-1 default TTL
    not-found-ttl: PT6H
    per-host-min-interval-ms: 1000   # CON-2: <= 1 req/s/host, configurable down only
  quotas:
    max-journals-default: 10   # admin-set per org via org_quota during beta (FR-JRN-3)
  crawl:
    page-cap-default: 3000     # FR-CRWL-4 default cap per audit
    max-depth: 10
    poll-interval-ms: 5000
  snapshots:
    root-dir: ./data/snapshots # FileSystemSnapshotStore; S3/MinIO adapter in ops phase
  ai:
    provider: disabled         # disabled | anthropic (CON-4: switching is config, not code)
    base-url: https://api.anthropic.com
    api-key: ${JRAP_AI_API_KEY:}
    model: claude-3-5-haiku-latest
    audit-token-budget: 200000 # FR-BILL-2 mechanism: per-audit LLM budget
    prompt-versions: ""        # e.g. "board-extraction=v2" to pin a non-default version
  extract:
    confidence-threshold: 0.8  # FR-EXT-4: below this, rows enter the human review queue
    reconciliation-sample: 25  # FR-EXT-5: articles sampled per audit for DOI reconciliation
  analysis:
    rubric-version: "1.0"      # §5.2: versioned rubric config; audits freeze the version used
    misattribution-sample: 10  # FR-ANL-8 sole-authored articles sampled per audit
    copied-text-sample: 10     # FR-ANL-9 abstracts sampled per audit
  search:
    provider: disabled         # FR-INT-5 pluggable web-search adapter (disabled => UNCLEAR)
  admin:
    # Comma-separated platform-administrator emails (FR-ADM-1) — override JRAP_ADMIN_EMAILS.
    emails: ""
  platform:
    webhook-poll-ms: 30000   # §3.2.2 webhook dispatcher cadence
    schedule-poll-ms: 60000  # FR-DASH-3 re-audit scheduler cadence
  security:
    # Dev-only default — override JRAP_SECURITY_JWT_SECRET in every real environment.
    jwt-secret: ZGV2LW9ubHktc2VjcmV0LWRldi1vbmx5LXNlY3JldC1kZXYtb25seS1zZWNyZXQ=
    access-token-ttl: PT15M
    cors-allowed-origins: http://localhost:5173
