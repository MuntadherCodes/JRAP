# Local development infrastructure (SRS §2.4)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jrap
      POSTGRES_USER: jrap
      POSTGRES_PASSWORD: jrap
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jrap
      MINIO_ROOT_PASSWORD: jrap-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
